<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — Xceed Studio PG UI</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <!-- Custom styles -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 login-page-bg">

  <div class="card login-card login-card-width p-4 p-sm-5">
    <div class="login-logo">
      <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h4 class="fw-bold text-center mb-1">Xceed Studio PG UI</h4>
    <p class="text-center text-muted mb-4 login-subtitle">Administrator Portal</p>

    <div id="login-alert" class="alert d-none" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label fw-medium">Username</label>
        <input type="text" id="username" class="form-control" required autocomplete="username" placeholder="Enter username">
      </div>
      <div class="mb-4">
        <label for="password" class="form-label fw-medium">Password</label>
        <input type="password" id="password" class="form-control" required autocomplete="current-password" placeholder="Enter password">
      </div>
      <div id="captcha-wrap" class="mb-3 d-none">
        <label class="form-label fw-medium">Security Check</label>
        <div id="captcha-widget" class="d-flex justify-content-center"></div>
        <div id="captcha-status" class="small text-muted mt-2"></div>
      </div>
      <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2">
        <span id="login-spinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
        Login
      </button>
    </form>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="/login.js"></script>
</body>
</html>
